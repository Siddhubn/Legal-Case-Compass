<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 - Page Not Found | Legal Case Compass</title>
  <link rel="icon" type="image/png" href="/static/lcc_logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            serif: ['Playfair Display', 'Georgia', 'serif'],
            legal: ['Libre Baskerville', 'Georgia', 'serif'],
          },
          colors: {
            'primary': { 'DEFAULT': '#1e3a8a', 'dark': '#1e40af', 'light': '#3b82f6' },
            'judiciary': { 
              'gold': '#c9a961',
              'darkgold': '#a68a4d',
              'maroon': '#7c2d12',
              'navy': '#1e3a8a',
              'darknav': '#0f172a',
              'cream': '#fef3c7'
            }
          },
          letterSpacing: {
            'legal': '0.025em',
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    * { transition: background-color 0.3s ease, color 0.3s ease; }

    /* Professional Judiciary-Themed Scrollbar */
    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }

    ::-webkit-scrollbar-track {
      background: linear-gradient(180deg, #f3f4f6 0%, #e5e7eb 100%);
      border-radius: 10px;
      border: 1px solid #d1d5db;
    }

    .dark ::-webkit-scrollbar-track {
      background: linear-gradient(180deg, #1f2937 0%, #111827 100%);
      border: 1px solid #374151;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #d4af37 0%, #b8941f 100%);
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: padding-box;
      transition: all 0.3s ease;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #ffd700 0%, #d4af37 100%);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
      transform: scale(1.05);
    }

    ::-webkit-scrollbar-thumb:active {
      background: linear-gradient(180deg, #b8941f 0%, #9a7a1a 100%);
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: #d4af37 #f3f4f6;
    }

    .dark * {
      scrollbar-color: #d4af37 #1f2937;
    }

    html {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800 flex items-center justify-center px-4">
  <div class="text-center">
    <div class="relative inline-block mb-8">
      <div class="absolute inset-0 bg-gradient-to-r from-judiciary-gold to-yellow-600 rounded-full blur-xl opacity-40"></div>
      <div class="relative w-32 h-32 bg-white rounded-full p-6 shadow-2xl">
        <img src="/static/lcc_logo.png" alt="Legal Case Compass" class="w-full h-full opacity-50" />
      </div>
    </div>
    
    <h1 class="text-6xl font-bold text-gray-900 dark:text-white mb-4">404</h1>
    <h2 class="text-2xl font-semibold text-gray-700 dark:text-gray-300 mb-4">Page Not Found</h2>
    <p class="text-gray-600 dark:text-gray-400 mb-8">The page you're looking for doesn't exist.</p>
    
    <a href="/" class="inline-block px-8 py-3 bg-gradient-to-r from-primary to-primary-dark hover:from-primary-dark hover:to-primary text-white rounded-lg shadow-lg hover:shadow-xl transition-all duration-200 font-medium">
      Go Home
    </a>
  </div>
</body>
</html>
