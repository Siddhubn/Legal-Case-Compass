<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard - Legal Case Compass</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50">
  <nav class="bg-white shadow">
    <div class="max-w-6xl mx-auto px-4">
      <div class="flex justify-between">
        <div class="flex space-x-4">
          <a href="/" class="flex items-center py-4 px-2 text-primary font-bold">
            <img src="/static/lcc_logo.png" alt="logo" class="h-10 w-10 mr-2" />
            <span>Legal Case Compass</span>
          </a>
          <a href="/app" class="py-4 px-2 text-gray-700 hover:text-primary">Analyze</a>
        </div>
        <div class="hidden md:flex items-center space-x-1">
          {% if session.get('username') %}
            <span class="py-2 px-3 text-sm text-gray-700">Signed in as <strong>{{ session.get('username') }}</strong></span>
            <form id="navLogout" method="post" action="/logout" class="inline">
              <button type="submit" class="py-2 px-3 bg-red-500 text-white rounded">Logout</button>
            </form>
          {% else %}
            <a href="/login" class="py-2 px-3 border rounded">Login</a>
          {% endif %}
        </div>
      </div>
    </div>
  </nav>
  <div class="max-w-6xl mx-auto py-8 px-4">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-semibold">Your Dashboard</h1>
      <div class="space-x-2">
        <a href="/app" class="px-3 py-2 bg-white border rounded">New analysis</a>
        <button id="logoutBtn" class="px-3 py-2 bg-red-500 text-white rounded">Logout</button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="col-span-2 bg-white rounded shadow p-4">
        <h2 class="text-lg font-medium mb-3">Saved Analyses</h2>
        <div id="analysesList" class="space-y-3 text-sm text-gray-700">
            <p class="text-gray-500 italic">Loading...</p>
        </div>
      </div>

      <div class="bg-white rounded shadow p-4">
        <h2 class="text-lg font-medium mb-3">Profile</h2>
        <div id="profileForm">
          <label class="block text-xs text-gray-600">Full name</label>
          <input id="full_name" class="w-full border rounded px-2 py-1 mb-2" />
          <label class="block text-xs text-gray-600">Phone</label>
          <input id="phone" class="w-full border rounded px-2 py-1 mb-2" />
          <label class="block text-xs text-gray-600">Current address</label>
          <input id="address_current" class="w-full border rounded px-2 py-1 mb-2" />
          <label class="block text-xs text-gray-600">Permanent address</label>
          <input id="address_permanent" class="w-full border rounded px-2 py-1 mb-2" />
          <label class="block text-xs text-gray-600">Date of birth</label>
          <input id="dob" type="date" class="w-full border rounded px-2 py-1 mb-2" />
          <label class="block text-xs text-gray-600">Email</label>
          <input id="email" type="email" class="w-full border rounded px-2 py-1 mb-3" />
          <div class="flex justify-end">
            <button id="saveProfile" class="px-3 py-2 bg-primary text-white rounded">Save</button>
          </div>
          <div id="profileMsg" class="text-sm mt-2"></div>
        </div>
      </div>
    </div>

    <div id="viewer" class="mt-6 bg-white rounded shadow p-4 hidden">
      <h3 class="font-medium">Loaded analysis</h3>
      <div id="viewerContent" class="mt-2 text-sm text-gray-700"></div>
    </div>
  </div>

  <script>
    async function fetchData() {
      try {
        const res = await fetch('/my_analyses');
        if (!res.ok) { window.location.href = '/login'; return; }
        const data = await res.json();
        if (!data.ok) { window.location.href = '/login'; return; }
        renderAnalyses(data.analyses);
        renderProfile(data.user);
      } catch (e) { console.error(e); }
    }

    function renderAnalyses(list) {
      const el = document.getElementById('analysesList');
      if (!list || list.length === 0) { el.innerHTML = '<p class="text-gray-500 italic">No saved analyses yet.</p>'; return; }
      el.innerHTML = '';
      list.forEach(a => {
        const d = document.createElement('div');
        d.className = 'flex items-start justify-between border rounded p-3 hover:shadow-sm';
        d.style.cursor = 'default';

        // Left area: filename, created, preview — make clickable as well
        const left = document.createElement('div');
        left.className = 'flex-1 pr-3';
        const title = document.createElement('div');
        title.className = 'font-medium text-gray-800';
        title.textContent = a.filename || 'Uploaded file';
        left.appendChild(title);
        if (a.created_at) {
          const createdEl = document.createElement('div');
          createdEl.className = 'text-xs text-gray-500';
          createdEl.textContent = a.created_at;
          left.appendChild(createdEl);
        }
        if (a.preview) {
          const prev = document.createElement('div');
          prev.className = 'text-xs text-gray-600 mt-1';
          prev.textContent = a.preview;
          left.appendChild(prev);
        }

        // Right area: load button
        const right = document.createElement('div');
        const btn = document.createElement('button');
        btn.className = 'px-3 py-1 bg-primary text-white rounded';
        btn.type = 'button';
        btn.textContent = 'Load';
        btn.dataset.id = a.id;
        right.appendChild(btn);

        // Append
        d.appendChild(left);
        d.appendChild(right);
        el.appendChild(d);

        // Click handlers: both the button and left area load the analysis
        btn.addEventListener('click', (e) => { e.stopPropagation(); loadAnalysis(a.id); });
        left.addEventListener('click', () => loadAnalysis(a.id));
      });
    }

    function renderProfile(u) {
      if (!u) return;
      document.getElementById('full_name').value = u.full_name || '';
      document.getElementById('phone').value = u.phone || '';
      document.getElementById('address_current').value = u.address_current || '';
      document.getElementById('address_permanent').value = u.address_permanent || '';
      document.getElementById('dob').value = u.dob || '';
      document.getElementById('email').value = u.email || '';
    }

    async function loadAnalysis(id) {
      try {
        const res = await fetch(`/load_analysis/${id}`);
        if (!res.ok) { alert('Could not load'); return; }
        const data = await res.json();
        const viewer = document.getElementById('viewer');
        const content = document.getElementById('viewerContent');

        // Build structured HTML
        let html = '';
        html += `<div class="mb-3"><h4 class="font-medium">Plain-language summary</h4><div class="mt-1 text-gray-800">${escapeHtml(data.storySummary || 'N/A')}</div></div>`;
        html += `<div class="mb-3"><h4 class="font-medium">Legal summary</h4><div class="mt-1 text-gray-800">${escapeHtml(data.legalSummary || 'N/A')}</div></div>`;

        // Analysis: what_has_happened
        const analysis = data.analysis || {};
        html += `<div class="mb-3"><h4 class="font-medium">What has happened</h4><div class="mt-1 text-gray-800">${escapeHtml(analysis.what_has_happened || '')}</div></div>`;

        // key_legal_points (may be string or array)
        html += `<div class="mb-3"><h4 class="font-medium">Key legal points</h4>`;
        const kpoints = analysis.key_legal_points || '';
        html += renderAsList(kpoints);
        html += `</div>`;

        // general_follow_ups
        html += `<div class="mb-3"><h4 class="font-medium">General follow-ups</h4>`;
        const followups = analysis.general_follow_ups || '';
        html += renderAsList(followups);
        html += `</div>`;

        // Disclaimer
        if (analysis.disclaimer) {
          html += `<div class="mb-3 text-sm italic text-gray-600">${escapeHtml(analysis.disclaimer)}</div>`;
        }

        // Sources
        html += `<div class="mb-3"><h4 class="font-medium">Sources referenced</h4>`;
        if (data.sources && data.sources.length) {
          html += `<ul class="list-disc list-inside text-sm text-gray-700 mt-2">`;
          data.sources.forEach(s => { html += `<li><a class="text-primary underline" href="/get-file/${encodeURIComponent(s)}" target="_blank">${escapeHtml(s)}</a></li>`});
          html += `</ul>`;
        } else {
          html += `<div class="text-sm text-gray-500 italic mt-1">No sources saved.</div>`;
        }
        html += `</div>`;

        // Recommended lawyers (styled cards)
        html += `<div class="mb-3"><h4 class="font-medium">Recommended lawyers</h4>`;
        const rec = (data.recommended && data.recommended.recommended) ? data.recommended.recommended : [];
        if (rec.length > 0) {
          html += `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-2">`;
          rec.forEach(r => {
            html += `<div class="border rounded-lg p-3 shadow-sm bg-white">
                       <div class="flex items-center justify-between">
                         <div>
                           <div class="font-medium text-gray-800">${escapeHtml(r.name)}</div>
                           <div class="text-xs text-gray-600 mt-1">Category: <span class="font-medium">${escapeHtml(data.recommended.category || '')}</span></div>
                         </div>
                         <div class="text-right text-sm text-gray-600">
                           <div>Won: <span class="font-semibold">${escapeHtml(r.won || '')}</span></div>
                           <div class="mt-1">Fees: <span class="font-semibold">${escapeHtml(r.fees || '')}</span></div>
                         </div>
                       </div>
                       <div class="mt-3 text-sm text-gray-700">Phone: <a href="tel:${escapeHtml(r.phone)}" class="text-primary underline">${escapeHtml(r.phone)}</a></div>
                     </div>`;
          });
          html += `</div>`;
        } else {
          html += `<div class="text-sm text-gray-500 italic mt-1">No recommended lawyers available.</div>`;
        }
        html += `</div>`;

        content.innerHTML = html;
        viewer.classList.remove('hidden');
        // scroll to viewer
        viewer.scrollIntoView({behavior: 'smooth'});
      } catch (e) { console.error(e); }
    }

    function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function renderAsList(mixed) {
      // Accepts array or newline-separated string and returns HTML UL
      if (!mixed) return '<div class="text-sm text-gray-500 italic mt-1">No items.</div>';
      let items = [];
      if (Array.isArray(mixed)) items = mixed.filter(Boolean);
      else if (typeof mixed === 'string') items = mixed.split('\n').map(s => s.trim()).filter(Boolean);
      if (items.length === 0) return '<div class="text-sm text-gray-500 italic mt-1">No items.</div>';
      let out = '<ul class="list-disc list-inside text-sm text-gray-700 mt-2">';
      items.forEach(it => { out += `<li>${escapeHtml(it.replace(/^[-*\s]+/, ''))}</li>`; });
      out += '</ul>';
      return out;
    }

    document.getElementById('saveProfile').addEventListener('click', async () => {
      const payload = {
        full_name: document.getElementById('full_name').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        address_current: document.getElementById('address_current').value.trim(),
        address_permanent: document.getElementById('address_permanent').value.trim(),
        dob: document.getElementById('dob').value,
        email: document.getElementById('email').value.trim()
      };
      const msg = document.getElementById('profileMsg'); msg.textContent = '';
      try {
        const res = await fetch('/profile', {method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)});
        const data = await res.json();
        if (!res.ok) { msg.textContent = data.error || 'Could not save'; msg.className='text-sm text-red-500'; return; }
        msg.textContent = 'Saved'; msg.className='text-sm text-green-600';
      } catch (e) { msg.textContent = 'Network error'; msg.className='text-sm text-red-500'; }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/logout', {method:'POST'});
      window.location.href = '/';
    });

      // Navbar logout form (if present) should POST via fetch to avoid showing raw JSON
      const navLogout = document.getElementById('navLogout');
      if (navLogout) {
        navLogout.addEventListener('submit', async (e) => {
          e.preventDefault();
          try {
            await fetch('/logout', {method:'POST'});
          } catch (err) { /* ignore */ }
          window.location.href = '/';
        });
      }

    // on load
    fetchData();
  </script>
</body>
</html>
