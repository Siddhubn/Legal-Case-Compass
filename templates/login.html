<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Legal Case Compass</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-50">
  <nav class="bg-white shadow fixed top-0 left-0 right-0">
    <div class="max-w-6xl mx-auto px-4">
      <div class="flex justify-between">
        <div class="flex space-x-4">
          <a href="/" class="flex items-center py-4 px-2 text-primary font-bold">
            <img src="/static/lcc_logo.png" alt="logo" class="h-10 w-10 mr-2" />
            <span>Legal Case Compass</span>
          </a>
          <a href="/app" class="py-4 px-2 text-gray-700 hover:text-primary">Analyze</a>
        </div>
        <div class="flex items-center space-x-1">
          {% if session.get('username') %}
            <span class="py-2 px-3 text-sm text-gray-700">Signed in as <strong>{{ session.get('username') }}</strong></span>
            <form id="navLogout" method="post" action="/logout" class="inline">
              <button type="submit" class="py-2 px-3 bg-red-500 text-white rounded">Logout</button>
            </form>
          {% else %}
            <a href="/register" class="py-2 px-3 border rounded">Register</a>
          {% endif %}
        </div>
      </div>
    </div>
  </nav>
  <div class="pt-20"></div>
  <div class="max-w-md w-full bg-white rounded-lg shadow p-6">
    <h1 class="text-2xl font-semibold mb-4">Login</h1>
    <div id="error" class="text-sm text-red-500 mb-3 hidden"></div>
    <form method="post" action="/login">
      <label class="block text-sm font-medium text-gray-700">Username</label>
      <input name="username" id="username" class="mt-1 mb-3 block w-full border rounded px-3 py-2" />
      <label class="block text-sm font-medium text-gray-700">Password</label>
      <input name="password" id="password" type="password" class="mt-1 mb-4 block w-full border rounded px-3 py-2" />
      <div class="flex items-center justify-between">
        <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded">Login</button>
        <a href="/register" class="text-sm text-primary underline">Create account</a>
      </div>
    </form>
  </div>

  <!-- Using native form POST; no JS required for login form -->
  <script>
    const navLogout = document.getElementById('navLogout');
    if (navLogout) {
      navLogout.addEventListener('submit', async (e) => {
        e.preventDefault();
        try { await fetch('/logout', {method: 'POST'}); } catch (err) {}
        window.location.href = '/';
      });
    }
  </script>
</body>
</html>
